name: Container Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    runs-on: ubuntu-latest
    env:
      INITIAL_ADMIN_PASSWORD: ci-test-admin-password
      TOOLS_API_KEY: ci-test-tools-key-32-character-value
      POSTGRES_PASSWORD: ci-test-postgres-password
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Build runtime images
        run: docker compose build backend frontend

      # continue-on-error keeps a failing scan (fixable CRITICAL/HIGH found)
      # from aborting the job. Without it, a backend finding stopped the job
      # before the frontend scan ran, so trivy-frontend-results.sarif was never
      # written and the "Upload frontend Trivy SARIF" step (if: always()) then
      # errored with "Path does not exist: trivy-frontend-results.sarif". Both
      # scans now always run and always write their SARIF; the gate step below
      # re-imposes the build failure on any fixable CRITICAL/HIGH.
      - name: Scan backend image for critical and high CVEs
        id: scan-backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: edq-backend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-backend-results.sarif
          trivyignores: .trivyignore

      - name: Scan frontend image for critical and high CVEs
        id: scan-frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: edq-frontend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-frontend-results.sarif
          trivyignores: .trivyignore

      # Diagnostic only (exit-code 0, never fails the job): print the exact
      # fixable CRITICAL/HIGH findings to the job log, since the gating scans
      # above emit SARIF (no console table) and branch code-scanning alerts are
      # not always indexed. Makes the residual CVE visible for a targeted bump.
      - name: Diagnostic - list backend fixable CRITICAL/HIGH CVEs
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: edq-backend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Upload backend Trivy SARIF
        if: always() && hashFiles('trivy-backend-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

      - name: Upload frontend Trivy SARIF
        if: always() && hashFiles('trivy-frontend-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

      - name: Fail if any image has fixable CRITICAL/HIGH CVEs
        if: always()
        run: |
          backend_outcome='${{ steps.scan-backend.outcome }}'
          frontend_outcome='${{ steps.scan-frontend.outcome }}'
          echo "Backend scan outcome:  $backend_outcome"
          echo "Frontend scan outcome: $frontend_outcome"
          failed=0
          # An empty outcome means the scan step was skipped (e.g. the image
          # build failed) — treat that as a failure too, since we have no clean
          # scan result to trust.
          if [ "$backend_outcome" != "success" ]; then
            echo "::error::Backend image has fixable CRITICAL/HIGH CVEs (or the scan did not complete)."
            failed=1
          fi
          if [ "$frontend_outcome" != "success" ]; then
            echo "::error::Frontend image has fixable CRITICAL/HIGH CVEs (or the scan did not complete)."
            failed=1
          fi
          exit "$failed"
